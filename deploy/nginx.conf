# WallDecor Partner Portal - nginx (HTTPS variant)
#
# Setup (replace portal.walldecor.pl if you use another domain):
#   1. Point the DNS A record of portal.walldecor.pl to this server (51.83.197.9).
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/portal && sudo ln -sf /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/portal
#   3. Obtain the certificate (certbot installs it under /etc/letsencrypt/live/portal.walldecor.pl/):
#        sudo certbot --nginx -d portal.walldecor.pl
#      (If nginx -t fails before the certificate exists, first deploy the HTTP-only
#      variant at the bottom of this file, run certbot, then switch to this file.)
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. In the app .env set:  NEXTAUTH_URL=https://portal.walldecor.pl
#      and restart the app (pm2 restart all --update-env).
#
# Until the domain is connected, use the HTTP-only variant kept in the comment at the bottom.

server {
    listen 80;
    server_name portal.walldecor.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.walldecor.pl;

    ssl_certificate     /etc/letsencrypt/live/portal.walldecor.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.walldecor.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Larger body for file uploads (project files, invoices - max 15 MB)
    client_max_body_size 15M;

    # Proxy to Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Block direct access to private_uploads (served only via API)
    location /private_uploads {
        deny all;
        return 403;
    }
}

